<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d14">
<title>Baile da Quebrada 3D</title>
<style>
:root{color-scheme:dark;--glass:rgba(8,13,20,.78);--line:rgba(255,255,255,.18);--gold:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d14;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#1b2938,#06090e);z-index:10;transition:opacity .6s}
.loadbox{width:min(86vw,420px);padding:26px;border:1px solid #ffffff22;background:#080d14cc;border-radius:20px;box-shadow:0 20px 80px #0008}
.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(21px,5vw,30px);line-height:1.1}.brand span{color:var(--gold)}
.sub{color:#aebdca;font-size:13px;margin:10px 0 20px}.bar{height:4px;background:#263342;border-radius:9px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#ff9f43,#ffe08a);transition:width .3s}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0004}
#mission{position:absolute;left:14px;top:14px;padding:12px 14px;max-width:250px}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:800}
#mission strong{display:block;font-size:14px;margin-top:5px}
#mission small{display:block;color:#b9c4cf;margin-top:5px;font-size:11px;line-height:1.35}
#stats{position:absolute;right:14px;top:14px;text-align:right;padding:10px 12px;min-width:118px}
#speed{font-size:28px;font-weight:850;letter-spacing:-.05em;font-variant-numeric:tabular-nums}#speed small{font-size:10px;color:#b9c4cf;letter-spacing:.1em}
#gear{color:var(--gold);font-size:12px;font-weight:800}
#toast{position:absolute;left:50%;top:19%;transform:translateX(-50%);padding:9px 14px;white-space:nowrap;font-size:12px;opacity:0;transition:opacity .2s}
#controls{position:absolute;inset:0}
#stick{pointer-events:auto;position:absolute;left:20px;bottom:max(24px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:1px solid #ffffff44;background:#111a26aa;backdrop-filter:blur(5px);touch-action:none}
#stick:before{content:"";position:absolute;inset:31px;border:1px solid #ffffff20;border-radius:50%}
#knob{position:absolute;left:42px;top:42px;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#ffffffb8,#a9b8c899);border:1px solid #fff9;box-shadow:0 4px 12px #0008}
.action{pointer-events:auto;position:absolute;display:grid;place-items:center;border:1px solid #ffffff55;background:#101a28cc;backdrop-filter:blur(8px);color:white;border-radius:50%;font-weight:800;touch-action:none;user-select:none;box-shadow:0 6px 18px #0005}
.action:active,.action.active{background:#ffc857dd;color:#111}
#gas{right:24px;bottom:max(30px,env(safe-area-inset-bottom));width:76px;height:76px;font-size:12px}
#brake{right:108px;bottom:max(45px,calc(env(safe-area-inset-bottom) + 15px));width:58px;height:58px;font-size:10px}
#handbrake{right:35px;bottom:max(122px,calc(env(safe-area-inset-bottom) + 105px));width:54px;height:54px;font-size:10px}
#reset{right:16px;top:105px;width:40px;height:40px;font-size:18px}
#hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:10px;color:#dce4ebaa;text-align:center;white-space:nowrap}
#start{pointer-events:auto;width:100%;border:0;border-radius:11px;padding:14px 16px;background:linear-gradient(90deg,#ffb23f,#ffe08a);color:#15120b;font-weight:900;letter-spacing:.08em;font-size:13px}
#footnote{font-size:10px;color:#8293a3;margin-top:12px;line-height:1.4}
@media(min-width:800px){#stick{width:148px;height:148px;left:28px;bottom:28px}#knob{left:50px;top:50px}#gas{right:35px;bottom:35px}#brake{right:125px;bottom:50px}#handbrake{right:46px;bottom:135px}}
</style>
</head>
<body>
<div id="loading"><div class="loadbox"><div class="brand">BAILE DA <span>QUEBRADA</span></div><div class="sub">3D OPEN WORLD · PROTÓTIPO WEB</div><div class="bar"><i id="progress"></i></div><div class="sub" id="loadtext" style="margin:12px 0 0">Preparando a cidade...</div></div></div>
<div id="hud">
  <div id="mission" class="panel"><div class="eyebrow">OBJETIVO ATUAL</div><strong id="missiontitle">Explore a quebrada</strong><small id="missiondesc">Dirija pela avenida e siga as luzes do baile.</small></div>
  <div id="stats" class="panel"><div id="speed">000 <small>KM/H</small></div><div id="gear">D · DRIVE</div></div>
  <div id="toast" class="panel">Boa! Continue dirigindo.</div>
  <div id="controls">
    <div id="stick"><div id="knob"></div></div>
    <button class="action" id="gas">ACELERAR</button>
    <button class="action" id="brake">FREIO</button>
    <button class="action" id="handbrake">DRIFT</button>
    <button class="action" id="reset" aria-label="Reposicionar">↻</button>
    <div id="hint">Controle esquerdo: direção · Direita: acelerar/frear</div>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const loading=$('loading'), progress=$('progress'), loadtext=$('loadtext');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x111d2b); scene.fog=new THREE.FogExp2(0x111d2b,.0075);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.65)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0x9bbce2,0x30241c,2.1);scene.add(hemi);
const moon=new THREE.DirectionalLight(0xc4d9ff,2.0);moon.position.set(-80,120,45);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);moon.shadow.camera.left=-90;moon.shadow.camera.right=90;moon.shadow.camera.top=90;moon.shadow.camera.bottom=-90;scene.add(moon);
const warm=new THREE.PointLight(0xffa44d,40,85,2);warm.position.set(0,9,-55);scene.add(warm);
function mat(color,rough=.8,metal=0,extra={}){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,...extra})}
const asphalt=mat(0x20262b,.94), concrete=mat(0x777a79), sidewalk=mat(0x565b5d), white=mat(0xe9ecec,.25,.45), black=mat(0x101419,.42,.2), rubber=mat(0x101113), glass=mat(0x182b39,.19,.35,{transparent:true,opacity:.82}), chrome=mat(0x9fa9b2,.22,.85), red=mat(0x9f1720,.28,.35), yellow=mat(0xffb83d,.25,.2), brick=mat(0x6d5145), plaster=mat(0x9b8d7c), blue=mat(0x314d63), graffiti=mat(0x9b477f,.65);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),mat(0x11191c));ground.rotation.x=-Math.PI/2;ground.position.y=-.16;ground.receiveShadow=true;scene.add(ground);
const city=new THREE.Group();scene.add(city);
function box(parent,w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function road(w,d,x,z){box(city,w,.18,d,asphalt,x,-.04,z);for(let xx=x-w/2+2;xx<x+w/2;xx+=7){box(city,.12,.012,1.8,mat(0xd2c9a9),xx,.06,z)}}
road(19,520,0,-110);road(520,16,0,-35);road(240,14,0,-155);
function building(x,z,w,d,h,material){
 const g=new THREE.Group();g.position.set(x,0,z);city.add(g);
 box(g,w,h,d,material,0,h/2,0);
 // roof parapet
 box(g,w+.25,.32,d+.25,mat(0x454749),0,h+.12,0);
 const cols=Math.max(2,Math.floor(w/2.5)), rows=Math.max(2,Math.floor(h/2.5));
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const wx=-w/2+(c+.5)*w/cols, wy=1.15+r*(h-1.5)/rows;
  if(wy>h-.6)continue;
  const on=Math.random()>.26;
  const winMat=on?new THREE.MeshStandardMaterial({color:0xffc46b,emissive:0xff8b30,emissiveIntensity:.8,roughness:.3}):mat(0x15212a,.4);
  box(g,.65,.85,.035,winMat,wx,wy,d/2+.025);
  if(Math.random()>.6)box(g,.75,.08,.12,chrome,wx,wy-.5,d/2+.06);
 }
 // AC boxes
 if(h>8)for(let i=0;i<Math.floor(w/5);i++)box(g,.7,.5,.45,mat(0x777d80),-w/2+2+i*4,2,d/2+.25);
 return g;
}
const materials=[brick,plaster,blue,mat(0x8b7770),mat(0x4e5a58),mat(0x9b927d)];
for(let side of [-1,1]){
 for(let z=-290;z<80;z+=18+Math.random()*7){
  const w=8+Math.random()*10,d=10+Math.random()*9,h=8+Math.random()*19;
  building(side*(13+w/2),z,w,d,h,materials[Math.floor(Math.random()*materials.length)]);
 }
}
for(let x=-105;x<=105;x+=18){if(Math.abs(x)<17)continue;building(x,-67,10,12,8+Math.random()*10,materials[Math.floor(Math.random()*materials.length)])}
// road details, sidewalks and crosswalk
for(let side of [-1,1]){box(city,2,.25,520,sidewalk,side*10.6,-.02,-110);for(let z=-275;z<90;z+=9)box(city,1.8,.08,.1,mat(0x8a8c89),side*10.6,.12,z)}
for(let i=0;i<7;i++)box(city,1.5,.025,4,mat(0xd8d6cc),-7.5+i*2.5,.07,-36);
// streetlights
function streetlight(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);city.add(g);
 const pole= new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,6,8),mat(0x333a3f));pole.position.y=3;g.add(pole);
 const arm=box(g,1.7,.08,.08,mat(0x333a3f),x<0?.75:-.75,5.7,0);arm.rotation.z=x<0?-.12:.12;
 const lamp=new THREE.Mesh(new THREE.BoxGeometry(.6,.16,.35),mat(0xffe0a0,.3,0,{emissive:0xffa23d,emissiveIntensity:2}));lamp.position.set(x<0?1.45:-1.45,5.65,0);g.add(lamp);
 const light=new THREE.PointLight(0xffb763,14,22,2);light.position.set(x<0?1.45:-1.45,5.4,0);g.add(light);
}
for(let z=-270;z<80;z+=27){streetlight(-10.3,z);streetlight(10.3,z+13)}
// baile stage and speakers
const stage=new THREE.Group();stage.position.set(0,0,-65);scene.add(stage);
box(stage,18,.65,5,mat(0x252a31),0,1.1,0);
box(stage,18,5,.35,mat(0x171a24),0,4,-2.4);
const neon=new THREE.MeshStandardMaterial({color:0xff237c,emissive:0xff0060,emissiveIntensity:2.7});
box(stage,12,.12,.18,neon,0,6.4,-2.15);
for(let x=-8;x<=8;x+=2){box(stage,.7,5,.75,black,x,3.8,-2.9);for(let y=2;y<=5;y+=1.5){const s=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.12,20),mat(0x171d27,.45,.2));s.rotation.x=Math.PI/2;s.position.set(x,y,-2.48);stage.add(s);const ring=new THREE.Mesh(new THREE.TorusGeometry(.39,.035,6,24),new THREE.MeshStandardMaterial({color:x%4===0?0x19bfff:0xff246b,emissive:x%4===0?0x0088ff:0xff0055,emissiveIntensity:2}));ring.position.set(x,y,-2.39);stage.add(ring)}}
const sign=box(stage,7,1.6,.2,mat(0x211329),0,4.8,-2.1);
function textSprite(text,color='#fff'){const c=document.createElement('canvas');c.width=1024;c.height=256;const ctx=c.getContext('2d');ctx.clearRect(0,0,1024,256);ctx.font='900 112px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillText(text,512,128);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(6.7,1.65),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));m.position.set(0,4.8,-1.97);stage.add(m)}
textSprite('BAILE DA QUEBRADA','#ff65ae');
for(let i=0;i<26;i++){const x=(Math.random()-.5)*34,z=-57-Math.random()*13;const c=new THREE.Group();c.position.set(x,0,z);scene.add(c);const shirt=[0x171b22,0x4e2538,0x243f51,0x5a5144,0xeee0c9][i%5];const body= new THREE.Mesh(new THREE.CapsuleGeometry(.27,.7,4,8),mat(shirt));body.position.y=1.05;c.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),mat(0x8f6247));head.position.y=1.68;c.add(head);const legmat=mat(0x202329);for(let s of [-1,1]){const leg=box(c,.15,.6,.17,legmat,s*.13,.35,0);leg.rotation.z=s*.08}}
// car model, nose points local -Z
const car=new THREE.Group();scene.add(car);
const shell=box(car,2.05,.58,4.15,white,0,.88,0);
const hood=box(car,1.92,.16,1.25,white,0,1.16,-1.38);
const trunk=box(car,1.92,.18,.72,white,0,1.12,1.55);
const cabin=box(car,1.58,.76,1.9,white,0,1.48,.1);
const windshield=box(car,1.45,.55,.055,glass,0,1.53,-.67);windshield.rotation.x=-.18;
const rearwin=box(car,1.4,.48,.055,glass,0,1.53,.98);rearwin.rotation.x=.18;
for(let s of [-1,1]){box(car,.045,.55,.06,black,s*.8,1.5,.1);box(car,.12,.12,.2,black,s*1.02,1.3,-.55);box(car,.17,.1,.12,white,s*1.04,1.44,-.55)}
// grille, bumper, lights
box(car,.82,.18,.08,black,0,.75,-2.11);box(car,1.95,.16,.14,chrome,0,.57,-2.12);
for(let s of [-1,1]){box(car,.42,.2,.07,mat(0xf3f0dc,.25,.1,{emissive:0xffe5a5,emissiveIntensity:1.4}),s*.68,1.02,-2.09);box(car,.42,.2,.07,red,s*.68,1.02,2.09)}
// wheels
const wheels=[];
for(let x of [-1.03,1.03])for(let z of [-1.38,1.38]){
 const pivot=new THREE.Group();pivot.position.set(x,.48,z);car.add(pivot);
 const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.25,24),rubber);tire.rotation.z=Math.PI/2;tire.castShadow=true;pivot.add(tire);
 const rim=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.265,16),chrome);rim.rotation.z=Math.PI/2;pivot.add(rim);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.28,12),black);hub.rotation.z=Math.PI/2;pivot.add(hub);
 for(let j=0;j<5;j++){const spoke=box(pivot,.035,.43,.055,chrome,0,0,0);spoke.rotation.x=j*Math.PI*2/5;spoke.position.x=.145}
 wheels.push({pivot,x,z,tire});
}
for(let s of [-1,1]){box(car,.07,.25,.8,black,s*1.04,.72,.15);box(car,.12,.08,.28,chrome,s*1.06,.95,-.4)}
// shadow helper
car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
car.position.set(0,0,-4);
const beacon=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.03,12),mat(0x111));beacon.position.set(0,2.0,-.3);car.add(beacon);
// distant hill silhouettes
for(let i=0;i<16;i++){const h=15+Math.random()*25;const hill=new THREE.Mesh(new THREE.ConeGeometry(18+Math.random()*20,h,7),mat(0x17252d));hill.position.set((Math.random()-.5)*240,h/2-2,-230-Math.random()*120);scene.add(hill)}
// city skyline distant
for(let i=0;i<42;i++){const w=3+Math.random()*6,h=10+Math.random()*40,d=4+Math.random()*6;const b=box(scene,w,h,d,mat(0x283440),-110+i*5.4,h/2-1,-220-Math.random()*25);for(let n=0;n<Math.floor(h/3);n++)box(scene,.13,.15,.08,mat(0xffc36b,.3,0,{emissive:0xffa53d,emissiveIntensity:.5}),b.position.x-w*.25+(n%3)*.6,2+n*2.7,b.position.z+d/2+.05)}
// control state and simplified vehicle dynamics
let speed=0, steer=0, yaw=0, throttle=0, braking=0, drift=false, last=performance.now();
const input={x:0,y:0};let stickOn=false,stickId=null,gasOn=false,brakeOn=false,driftOn=false;
const maxSpeed=36; // m/s
function setHold(id,fnDown,fnUp){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);fnDown();el.classList.add('active')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,e=>{fnUp();el.classList.remove('active')})}
setHold('gas',()=>gasOn=true,()=>gasOn=false);setHold('brake',()=>brakeOn=true,()=>brakeOn=false);setHold('handbrake',()=>driftOn=true,()=>driftOn=false);
const stick=$('stick'),knob=$('knob');
function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=43,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}input.x=dx/max;input.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickOn=true;stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});
stick.addEventListener('pointermove',e=>{if(stickOn&&e.pointerId===stickId)stickMove(e)});
function releaseStick(){stickOn=false;stickId=null;input.x=0;input.y=0;knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);stick.addEventListener('lostpointercapture',releaseStick);
$('reset').addEventListener('pointerdown',e=>{e.preventDefault();car.position.set(0,0,-4);yaw=0;speed=0;car.rotation.y=0;showToast('Carro reposicionado')});
function showToast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').style.opacity=0,2100)}
// keyboard support
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function update(dt){
 const forwardKey=keys.w||keys.arrowup, reverseKey=keys.s||keys.arrowdown,leftKey=keys.a||keys.arrowleft,rightKey=keys.d||keys.arrowright;
 const acc=gasOn||forwardKey||input.y<-.25, br=brakeOn||reverseKey||input.y>.35;
 const steerInput=Math.abs(input.x)>.08?input.x:(leftKey?-1:rightKey?1:0);
 const hand=driftOn||keys[' '];
 if(acc)speed+=13*dt;else if(br)speed-=20*dt;else speed-=Math.sign(speed)*Math.min(Math.abs(speed),2.3*dt);
 if(hand)speed-=Math.sign(speed)*Math.min(Math.abs(speed),4.2*dt);
 speed=THREE.MathUtils.clamp(speed,-10,maxSpeed);
 const speedFactor=Math.min(Math.abs(speed)/8,1);
 steer=THREE.MathUtils.damp(steer,steerInput,5,dt);
 yaw+=steer*speedFactor*(hand?1.25:.83)*Math.sign(speed||1)*dt;
 car.rotation.y=yaw;
 const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 car.position.addScaledVector(fwd,speed*dt);
 // soft boundaries and street feel
 car.position.x=THREE.MathUtils.clamp(car.position.x,-8.6,8.6);
 car.position.z=THREE.MathUtils.clamp(car.position.z,-286,75);
 for(const w of wheels){w.tire.rotation.x-=speed*dt/.43;if(Math.abs(w.z)>1.3)w.pivot.rotation.y=steer*.35}
 // camera smooth follow, look slightly ahead
 const desired=new THREE.Vector3(car.position.x+Math.sin(yaw)*7,4.4,car.position.z+Math.cos(yaw)*7+8);
 camera.position.lerp(desired,1-Math.exp(-3.2*dt));
 const look=new THREE.Vector3(car.position.x-Math.sin(yaw)*5,1.1,car.position.z-Math.cos(yaw)*5);
 camera.lookAt(look);
 $('speed').innerHTML=String(Math.round(Math.abs(speed)*3.6)).padStart(3,'0')+' <small>KM/H</small>';
 $('gear').textContent=speed<-.5?'R · RÉ':'D · DRIVE';
 const dist=Math.hypot(car.position.x,car.position.z+65);
 if(dist<18){$('missiontitle').textContent='Você chegou ao baile!';$('missiondesc').textContent='Explore a área e curta o som.'}else{$('missiontitle').textContent='Siga até o baile';$('missiondesc').textContent='Distância aproximada: '+Math.round(dist)+' m · Dirija com cuidado.'}
}
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.035);last=now;update(dt);renderer.render(scene,camera)}
camera.position.set(0,4,8);camera.lookAt(0,1,-5);
let loaded=0;const fake=setInterval(()=>{loaded=Math.min(100,loaded+12);progress.style.width=loaded+'%';if(loaded>=100){clearInterval(fake);loadtext.textContent='Pronto para entrar';}},90);
$('start').addEventListener('click',()=>{loading.style.opacity=0;setTimeout(()=>loading.remove(),650);$('hud').style.display='block';animate(performance.now());showToast('Use os controles para dirigir!')});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65))}
addEventListener('resize',resize);
</script>
